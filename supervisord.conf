[supervisord]
nodaemon=true

[program:xray]
command=/usr/local/bin/xray run -config /etc/xray/config.json
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:cliproxyapi]
; 镜像默认 CMD 是 ./CLIProxyAPI，但我们显式指定更稳
command=/CLIProxyAPI/CLIProxyAPI --config /CLIProxyAPI/config.yaml
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
